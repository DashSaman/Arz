name: ARZ STRAT01 WETH 60m prior native result falsification (NO-GO)
on:
  push:
    branches: [research/2026-11-01-60m-native-falsification]
    paths:
      - 'scripts/strat01_60m_native_probe.py'
      - 'tests/test_strat01_60m_native_probe.py'
      - '.github/workflows/strat01-60m-native-audit.yml'
  pull_request:
    paths:
      - 'scripts/strat01_60m_native_probe.py'
      - '.github/workflows/strat01-60m-native-audit.yml'
permissions:
  contents: read
jobs:
  existing-history-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify Git tree identity and show existing native rows only
        run: python scripts/strat01_60m_native_probe.py
      - name: Core safety
        run: python scripts/verify_research_control.py
      - name: Adversarial native 60m WETH gate tests
        run: python -m unittest discover -s tests -p test_strat01_60m_native_probe.py -v
      - name: Audit paired native gate status strictly without promotional claims
        run: |
          python - <<'PY'
          import json
          with open('/tmp/arz_60m_native_gates.json') as f:
              d=json.load(f)
          assert d['financial_decision']=='NO-GO'
          assert d['no_live_orders'] is True
          assert len(d['gates'])==2
          assert len(d['annual_shortlist'])==2
          assert len(d['native_rows'])==16
          assert all(x['positive_annual_and_later6m_mid_stress']=='False'
                     and x['passes_all']=='False'
                     for x in d['gates'])
          print('READ_ONLY_NATIVE_WETH_60M_AUDIT_PASS_NO_GO')
          PY
      - name: Preserve exact prior-data audit
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arz-prior-native-weth-60m-gate-falsification
          path: /tmp/arz_60m_native_gates.json
          retention-days: 30
          if-no-files-found: error
