name: STRAT-01 offline paper infrastructure

on:
  push:
    paths:
      - 'scripts/strat01_multi_paper.py'
      - 'scripts/strat01_paper_*.py'
      - 'deploy/paper/**'
      - 'tests/test_strat01_multi_paper.py'
      - 'tests/test_strat01_paper_*.py'
      - '.github/workflows/strat01-paper-infrastructure.yml'
  pull_request:
    paths:
      - 'scripts/strat01_multi_paper.py'
      - 'scripts/strat01_paper_*.py'
      - 'deploy/paper/**'
      - 'tests/test_strat01_multi_paper.py'
      - 'tests/test_strat01_paper_*.py'
      - '.github/workflows/strat01-paper-infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: src:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile simulation-only components
        run: python3 -m py_compile scripts/strat01_multi_paper.py scripts/strat01_paper_runtime.py scripts/strat01_paper_backup.py
      - name: Test shared balance and fail-closed operations
        run: |
          python3 -m unittest discover -s tests -p 'test_strat01_multi_paper.py' -v
          python3 -m unittest discover -s tests -p 'test_strat01_paper_*.py' -v
      - name: Verify canonical research control
        run: PYTHONPATH=src:. python3 scripts/verify_research_control.py

  isolated-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify isolated Compose syntax with no real host
        env:
          ARZ_PAPER_IMAGE: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          ARZ_COLLECTOR_DATA_ROOT: /tmp/arz-ci-collector
          ARZ_PAPER_DATA_ROOT: /tmp/arz-ci-paper
          ARZ_PAPER_INPUT_ROOT: /tmp/arz-ci-paper-input
        run: docker compose -f deploy/paper/docker-compose.yml config --quiet
      - name: Build reviewed no-credential image
        run: |
          docker build \
            --file deploy/paper/Dockerfile \
            --build-arg ARZ_SOURCE_REVISION="${GITHUB_SHA}" \
            --tag arz-paper-ci:local .
      - name: Generate offline inventory SBOM from the built image
        run: |
          mkdir -p artifacts/paper
          docker run --rm --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            arz-paper-ci:local \
            python -m scripts.strat01_paper_sbom > artifacts/paper/paper.spdx.json
          docker run --rm --network none --read-only --user 65534:65534 \
            arz-paper-ci:local \
            sha256sum --check /app/source-sha256.txt > artifacts/paper/source-hash-verification.txt
          python3 - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('artifacts/paper/paper.spdx.json').read_text())
          assert s['spdxVersion']=='SPDX-2.3' and len(s['packages'])>10
          assert any(x['name']=='python-3.12-slim-bookworm' for x in s['packages'])
          assert any(x['fileName']=='./scripts/strat01_paper_runtime.py' for x in s['files'])
          print('CONTAINER_SBOM_INVENTORY:PASS (CVE scan not performed)')
          PY
      - name: Run no-network nonroot image and verify safety refusal
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/arz-paper-ci"/{collector/{forward,events},paper/{journal,observations,alerts}}
          chmod -R 755 "${RUNNER_TEMP}/arz-paper-ci"
          sudo chown -R 65534:65534 "${RUNNER_TEMP}/arz-paper-ci/paper"
          docker run --rm --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --volume "${RUNNER_TEMP}/arz-paper-ci/collector:/collector:ro" \
            --volume "${RUNNER_TEMP}/arz-paper-ci/paper:/paper:rw" \
            arz-paper-ci:local \
            python -m scripts.strat01_paper_runtime once --source-root /collector --paper-root /paper
          docker run --rm --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            --volume "${RUNNER_TEMP}/arz-paper-ci/paper:/paper:ro" \
            arz-paper-ci:local \
            python -m scripts.strat01_paper_runtime health --paper-root /paper
          sudo -E python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'arz-paper-ci'/'paper'
          s=json.loads((p/'status.json').read_text())
          assert s['financial_decision']=='NO-GO' and s['live_trading']=='DISABLED'
          assert s['paper_account']['hypothetical_fills']==0
          assert s['paper_qualified_calendar_days']==0
          assert len(list((p/'journal').glob('*.json')))==0
          print('ISOLATED_CONTAINER_SAFE_NO_FILL:PASS')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arz-paper-offline-container-evidence
          path: artifacts/paper/
          if-no-files-found: warn
          retention-days: 30
