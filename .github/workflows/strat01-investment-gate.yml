name: Arz STRAT01 investment evidence gate (never auto-approve capital)

on:
  push:
    branches:
      - main
      - research/2026-10-27-investment-evidence-gate
    paths:
      - scripts/strat01_investment_readiness.py
      - tests/test_strat01_investment_readiness.py
      - .github/workflows/strat01-investment-gate.yml
      - 'reports/strat01/forward/**'
      - 'reports/research/2026-10-26-holdout-net-profit-no-go.json'
      - research/control/STATE.json
  pull_request:
    paths:
      - scripts/strat01_investment_readiness.py
      - tests/test_strat01_investment_readiness.py
      - .github/workflows/strat01-investment-gate.yml
      - 'reports/strat01/forward/**'

permissions:
  contents: read

jobs:
  financial-source-refusal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fail-closed synthetic tamper and forward ledger regression
        run: python -m unittest discover -s tests -p 'test_strat01_investment_readiness.py' -v
      - name: Audit actual checked-in forward capture evidence without RPC
        run: |
          python scripts/strat01_investment_readiness.py --output /tmp/arz-investment-readiness.json
          python - <<'PY'
          import json
          with open("/tmp/arz-investment-readiness.json", encoding="utf-8") as f:
              report=json.load(f)
          assert report["investment_recommendation"] == "NO-GO"
          assert report["capital_activation_authorized"] is False
          assert report["live_trading"] == "DISABLED"
          assert report["source_capture_audit"]["qualified_trading_days"] == 0
          print("ARZ_REAL_EVIDENCE_FINANCIAL_STATUS=NO_GO")
          print("ARZ_REAL_CAPTURE_FILE_COUNT=" +
                str(report["source_capture_audit"]["file_count"]))
          PY
      - name: Full offline repository regression suite
        run: python -m unittest discover -s tests -q
      - name: Source integrity syntax and canonical safety controls
        run: |
          python -m compileall -q scripts/strat01_investment_readiness.py
          python scripts/verify_research_control.py
      - name: Preserve honest evidence report after each source push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arz-strat01-investment-readiness-no-go
          path: /tmp/arz-investment-readiness.json
          if-no-files-found: warn
          retention-days: 30
