name: Cross-market repeatability offline checks
on:
  push:
    paths:
      - 'experiments/crossmarket_repeatability/**'
      - 'reports/crossmarket_20261016/**'
      - '.github/workflows/crossmarket-offline.yml'
  pull_request:
    paths:
      - 'experiments/crossmarket_repeatability/**'
      - 'reports/crossmarket_20261016/**'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Isolated pinned external engine
        run: |
          python3 -m venv /tmp/arz-repeat-venv
          /tmp/arz-repeat-venv/bin/python -m pip --isolated install --disable-pip-version-check --no-input --only-binary=:all: --index-url https://pypi.org/simple -r experiments/upstream_benchmark/requirements.lock
      - name: Repeatability unit tests without market access
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=experiments/crossmarket_repeatability:experiments/upstream_benchmark /tmp/arz-repeat-venv/bin/python -m unittest discover -s experiments/crossmarket_repeatability -v
      - name: Existing synthetic engine tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=experiments/upstream_benchmark /tmp/arz-repeat-venv/bin/python -m unittest discover -s experiments/upstream_benchmark -v
