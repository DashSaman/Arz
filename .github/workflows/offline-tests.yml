name: Arz offline-only tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'configs/**'
      - 'pyproject.toml'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/offline-tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python offline accounting tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run offline unit tests (no keys, no network APIs)
        run: python3 -m unittest discover -s tests -v
      - name: Evaluate labeled synthetic example
        run: python3 scripts/compound_audit.py --csv data/SYNTHETIC_example_daily_returns.csv --initial 100
