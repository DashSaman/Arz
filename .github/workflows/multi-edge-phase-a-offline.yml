name: Multi-edge Phase A offline checks
on:
  push:
    paths:
      - 'src/arz/multi_edge/**'
      - 'scripts/multi_edge_phase_a.py'
      - 'scripts/multi_edge_public_probe.py'
      - 'tests/test_multi_edge_*.py'
      - 'research/multi_edge_spot/NEXT_EXPERIMENT_PROTOCOL.json'
      - 'reports/multi_edge_phase_a_20261020/**'
      - '.github/workflows/multi-edge-phase-a-offline.yml'
  pull_request:
    paths:
      - 'src/arz/multi_edge/**'
      - 'scripts/multi_edge_phase_a.py'
      - 'scripts/multi_edge_public_probe.py'
      - 'tests/test_multi_edge_*.py'
      - 'research/multi_edge_spot/NEXT_EXPERIMENT_PROTOCOL.json'
      - 'reports/multi_edge_phase_a_20261020/**'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Multi-edge focused offline tests
        run: python3 -m unittest tests.test_multi_edge_accounting tests.test_multi_edge_scoring tests.test_multi_edge_connectors tests.test_multi_edge_feasibility tests.test_multi_edge_delivery -v
      - name: Full offline regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Compile research code
        run: python3 -m compileall -q src/arz/multi_edge scripts/multi_edge_phase_a.py scripts/multi_edge_public_probe.py

      - name: Price-proxy lookahead / fold / checksum-parser regression
        env:
          PYTHONPATH: "src:."
        run: python -m unittest discover -s tests -p 'test_long_history_proxy.py' -v
      - name: Bounded new multi-year public CEX spot price proxy replay (NO orders)
        if: github.ref != 'refs/heads/research/2026-10-25-real-chain-bounded' && github.head_ref != 'research/2026-10-25-real-chain-bounded'
        env:
          PYTHONPATH: "src:."
        run: |
          python scripts/long_history_cex_proxy.py --output /tmp/arz-long-history-20261025.json
      - name: Upload derived report (no raw market redistribution)
        if: github.ref != 'refs/heads/research/2026-10-25-real-chain-bounded' && github.head_ref != 'research/2026-10-25-real-chain-bounded'
        uses: actions/upload-artifact@v4
        with:
          name: multi-year-price-proxy
          path: /tmp/arz-long-history-20261025.json
          if-no-files-found: warn
          retention-days: 30

      - name: Read-only Base and Solana protocol regression
        env:
          PYTHONPATH: "src:."
        run: python -m unittest discover -s tests -p 'test_bounded_real_chain_probe.py' -v
      - name: Bounded public-chain on-chain facts — no keys or transaction sends
        env:
          PYTHONPATH: "src:."
        run: |
          python scripts/bounded_real_chain_probe.py --output /tmp/arz-real-chain-probe-20261025.json
      - name: Preserve only derived on-chain evidence without raw provider payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arz-bounded-real-chain-evidence
          path: /tmp/arz-real-chain-probe-20261025.json
          if-no-files-found: warn
          retention-days: 30
