name: STRAT-01 independent Base identity and first-seen observations

on:
  push:
    branches: [research/2026-10-27-base-identity-prospective]
    paths:
      - scripts/strat01_base_identity_forward.py
      - tests/test_strat01_base_identity_forward.py
      - scripts/strat01_capture_slot_preflight.py
      - tests/test_strat01_capture_slot_preflight.py
      - .github/workflows/strat01-base-forward.yml
  pull_request:
    paths:
      - scripts/strat01_base_identity_forward.py
      - tests/test_strat01_base_identity_forward.py
      - scripts/strat01_capture_slot_preflight.py
      - tests/test_strat01_capture_slot_preflight.py
      - .github/workflows/strat01-base-forward.yml
  schedule:
    - cron: '23 0,4,8,12,16,20 * * *'
    # Backstop for missed/delayed GitHub cron runs. Same provider, not
    # an independent scheduler or guaranteed first-seen candle.
    - cron: '47 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arz-strat01-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test read-only Base factory/provider evidence
        run: python -m unittest discover -s tests -p 'test_strat01_base_identity_forward.py' -v
      - name: Full repository offline suite
        run: python -m unittest discover -s tests -q
      - name: Compile and enforce NO-GO
        run: |
          python -m compileall -q scripts/strat01_base_identity_forward.py
          python scripts/verify_research_control.py
      - name: One bounded identity check
        if: hashFiles('reports/strat01/2026-10-27-base-identity-observed.json') == ''
        run: python scripts/strat01_base_identity_forward.py --mode identity --output /tmp/arz-identity.json
      - name: One post-cutoff first-seen read-only snapshot
        if: hashFiles('reports/strat01/2026-10-27-base-forward-first-seen.json') == ''
        run: python scripts/strat01_base_identity_forward.py --mode forward --output /tmp/arz-first-seen.json
      - name: Archive bounded derived actual source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arz-identity-and-initial-asof
          path: |
            /tmp/arz-identity.json
            /tmp/arz-first-seen.json
          if-no-files-found: warn
          retention-days: 30

  future_capture:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fail-closed source, in-run audit contract and trading guards
        run: |
          python -m unittest discover -s tests -p 'test_strat01_base_identity_forward.py' -q
          python -m unittest discover -s tests -p 'test_strat01_investment_readiness.py' -q
          python -m unittest discover -s tests -p 'test_forward_pipeline_contract.py' -q
          python -m unittest discover -s tests -p 'test_forward_gap_latency.py' -q
          python -m unittest discover -s tests -p 'test_strat01_capture_slot_preflight.py' -q
          python scripts/verify_research_control.py
      - name: Decide current slot at actual UTC runner clock (not nominal cron)
        id: slot
        run: |
          set -eu
          python scripts/strat01_capture_slot_preflight.py --output /tmp/arz-source-slot-decision.json
          capture=$(python - <<'PY'
          import json
          x=json.load(open('/tmp/arz-source-slot-decision.json',encoding='utf-8'))
          assert x['financial_decision']=='NO-GO' and x['live_trading']=='DISABLED'
          assert x['real_capital_authorized_usd']==0 and x['qualifying_paper_days']==0
          print('true' if x['capture'] else 'false')
          PY
          )
          echo "capture=$capture" >> "$GITHUB_OUTPUT"
      - name: Capture one observed-at-runtime sample
        if: steps.slot.outputs.capture == 'true'
        id: capture
        run: |
          set -eu
          marker="$(date -u +%Y%m%dT%H%M%SZ)"
          file="reports/strat01/forward/${marker}.json"
          python scripts/strat01_base_identity_forward.py --mode forward --output "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Audit the captured source and fail closed BEFORE any git push
        if: steps.slot.outputs.capture == 'true'
        id: audit
        run: |
          set -eu
          source="${{ steps.capture.outputs.file }}"
          name="$(basename "$source")"
          audit="reports/strat01/audits/$name"
          python scripts/strat01_investment_readiness.py --output "$audit"
          SOURCE_FILE="$source" AUDIT_FILE="$audit" python - <<'PY'
          import json, os
          from pathlib import Path
          import hashlib
          from scripts.strat01_investment_readiness import snapshot_summary
          source=Path(os.environ["SOURCE_FILE"])
          audit_path=Path(os.environ["AUDIT_FILE"])
          capture=json.loads(source.read_text(encoding="utf-8"))
          result=json.loads(audit_path.read_text(encoding="utf-8"))
          # GitHub GITHUB_TOKEN push does not trigger another workflow.
          # Validate this exact file in this run (not only the surrounding dir).
          checked=snapshot_summary(capture,filename=source.name)
          decision=json.loads(Path('/tmp/arz-source-slot-decision.json').read_text(encoding='utf-8'))
          from datetime import datetime
          wall=datetime.fromisoformat(decision['actual_wall_clock_utc'])
          seen=datetime.fromisoformat(checked['first_seen'])
          assert decision['capture'] is True
          assert checked['bar_start']==decision['target_bar_start_unix']
          assert 0 <= (seen-wall).total_seconds() <= 90
          ledger=result["source_capture_audit"]
          assert result["investment_recommendation"] == "NO-GO"
          assert result["capital_activation_authorized"] is False
          assert result["live_trading"] == "DISABLED"
          assert checked["execution_verified"] is False
          assert ledger["file_count"] >= 1
          assert ledger["valid_source_files"] == ledger["file_count"]
          assert ledger["conflicts"] == []
          assert ledger["errors"] == []
          matched=[x for x in ledger["source_manifest"]
                    if x["filename"] == source.name]
          assert len(matched)==1
          assert matched[0]["sha256"]==hashlib.sha256(source.read_bytes()).hexdigest()
          assert matched[0]["first_seen"]==checked["first_seen"]
          print("ARZ_CAPTURE_IN_RUN_AUDIT=PASS_NO_GO")
          print("ARZ_CAPTURE_FIRST_SEEN="+checked["first_seen"])
          print("ARZ_COMPLETE_PAIR_BAR="+str(checked["two_asset_bar_received"]))
          PY
          echo "audit=$audit" >> "$GITHUB_OUTPUT"
      - name: Commit validated source and its financial refusal audit together
        if: steps.slot.outputs.capture == 'true'
        run: |
          set -eu
          file="${{ steps.capture.outputs.file }}"
          audit="${{ steps.audit.outputs.audit }}"
          test -s "$file"
          test -s "$audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$file" "$audit"
          git diff --cached --quiet && exit 1
          git commit -m "evidence: first-seen Base capture plus in-run NO-GO audit (no orders)"
          git push origin HEAD:main
      - name: Preserve both files even when audit, push or branch permissions fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arz-prospective-capture-plus-investment-audit
          path: |
            /tmp/arz-source-slot-decision.json
            reports/strat01/forward/*.json
            reports/strat01/audits/*.json
          if-no-files-found: warn
          retention-days: 30
