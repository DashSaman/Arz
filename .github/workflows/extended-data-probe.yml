name: Extended data feasibility probe
on:
  push:
    branches: [research/2026-10-13-extended-validation]
    paths: [.github/workflows/extended-data-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Public alternative data availability only
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,datetime,time
          def get(url):
              time.sleep(6)
              req=urllib.request.Request(url,headers={'Accept':'application/json;version=20230203','User-Agent':'Arz-Research/0.2 (public data feasibility)'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  raw=r.read(2000001)
                  if len(raw)>2000000: raise ValueError('response size limit')
              return json.loads(raw),hashlib.sha256(raw).hexdigest()
          pools=[('base','0xd0b53d9277642d899df5c87a3966a349a798f224'),('eth','0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640'),('solana','Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE')]
          for network,pool in pools:
              root=f'https://api.geckoterminal.com/api/v2/networks/{network}/pools/{pool}'
              try:
                  value,digest=get(root+'?include=base_token,quote_token,dex')
                  attr=value['data']['attributes']
                  print('ALT_METADATA',json.dumps({'network':network,'pool':pool,'attributes':{k:attr.get(k) for k in ['name','address','pool_created_at','reserve_in_usd','volume_usd','base_token_price_usd']},'relationships':value['data']['relationships'],'included':value.get('included',[]),'response_sha256':digest}))
                  value,digest=get(root+'/ohlcv/day?aggregate=1&limit=1000&currency=usd&include_empty_intervals=false&before_timestamp=1791849600')
                  rows=value['data']['attributes']['ohlcv_list']; timestamps=sorted(x[0] for x in rows)
                  print('ALT_COVERAGE',json.dumps({'network':network,'pool':pool,'rows':len(rows),'first':timestamps[0] if rows else None,'last':timestamps[-1] if rows else None,'gaps':sum(timestamps[i]-timestamps[i-1]!=86400 for i in range(1,len(timestamps))),'meta':value.get('meta'),'response_sha256':digest}))
              except Exception as exc: print('ALT_FAILURE',json.dumps({'network':network,'pool':pool,'error':str(exc)}))
          for symbol in ['ETH-USD','SOL-USD']:
              url=f'https://api.exchange.coinbase.com/products/{symbol}/candles?granularity=86400&start=2024-01-01T00%3A00%3A00Z&end=2024-01-04T00%3A00%3A00Z'
              try:
                  value,digest=get(url)
                  if not isinstance(value,list): raise ValueError(str(value))
                  print('PROXY_COVERAGE',json.dumps({'venue':'Coinbase Exchange','symbol':symbol,'url':url,'count':len(value),'first':min(x[0] for x in value),'last':max(x[0] for x in value),'fields':'time,low,high,open,close,base_volume','response_sha256':digest,'classification':'CEX_PRICE_PROXY_NOT_DEX_EXECUTION'}))
              except Exception as exc: print('PROXY_FAILURE',json.dumps({'symbol':symbol,'error':str(exc)}))
          PY
