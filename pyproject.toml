[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arz-research"
version = "0.1.0"
description = "Wallet-free DEX trading and DeFi research simulator"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
extended-data = ["pyarrow==21.0.0"]

[project.scripts]
arz = "arz.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
